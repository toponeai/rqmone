version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels:
      - dependencies
    groups:
      react-and-router:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "@tanstack/*"
      three-stack:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
          - "postprocessing"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"
    labels:
      - dependencies
      - ci
